name: EdgeRelay CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q app edge-node-01

      - name: Verify project files
        run: |
          test -f Dockerfile
          test -f compose.yaml
          test -f nginx/default.conf

      - name: Run automated tests
        run: |
          python -m pytest -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            maheshattanti1/edgerelay-backend:latest
            maheshattanti1/edgerelay-backend:${{ github.sha }}


  deploy:
    name: Deploy to AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Verify GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            core.info(`OIDC subject: ${payload.sub}`);
            core.info(`OIDC audience: ${payload.aud}`);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy application using AWS SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-05dc9fecdd4012397 \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["cd /home/ubuntu/EdgeRelay && docker compose -f compose.aws.yaml pull backend && docker compose -f compose.aws.yaml up -d --remove-orphans && sleep 10 && docker compose -f compose.aws.yaml ps && curl -fsS http://localhost/health"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-05dc9fecdd4012397

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-05dc9fecdd4012397 \
            --query "StandardOutputContent" \
            --output text
